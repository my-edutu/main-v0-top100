<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff8a12">
  <title>You're offline · Top100 AFL</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #faf9f6; color: #202020; font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; }
    .brand { color: #a54200; font-weight: 700; }
    h1 { line-height: 1.15; font-size: 2.4rem; }
    button { background: #a54200; color: white; border: 0; border-radius: 2rem; padding: .85rem 1.5rem; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #202020; outline-offset: 4px; }
  </style>
</head>
<body><main>
  <p class="brand">Top100 Africa Future Leaders</p>
  <h1>You're offline</h1>
  <p>Connect to the internet to access your dashboard and the latest updates.</p>
  <p>Your last action may not have been saved. Check its status after reconnecting.</p>
  <button type="button" onclick="window.location.reload()">Try again</button>
</main></body>
</html>
