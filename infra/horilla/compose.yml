services:
  web:
    image: horilla/horilla-hr:2.3.0
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ../files/local_settings.py:/app/horilla/settings/local_settings.py:ro
      - ../files/top100_work_guard.py:/app/top100_work_guard.py:ro
      - ../files/top100-login.html:/app/horilla_theme/templates/login.html:ro
      - ../files/top100-setup-checklist.html:/app/base/templates/base/setup_checklist_banner.html:ro
      - ../files/top100-header.html:/app/horilla_theme/templates/horilla_theme/components/header.html:ro
      - ../files/top100-sidebar.html:/app/horilla_theme/templates/horilla_theme/components/sidebar.html:ro
      - ../files/top100-dashboard.html:/app/templates/dashboard.html:ro
      - ../files/top100-work.css:/app/static/top100-work.css:ro
    mem_limit: 1536m
    environment:
      GUNICORN_WORKERS: '2'
      HORILLA_TRUSTED_PROXIES: nginx
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8000/health/']
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 5
  scheduler:
    image: horilla/horilla-hr:2.3.0
    restart: unless-stopped
    env_file: [.env]
    command: python manage.py run_scheduler
    environment:
      HORILLA_SKIP_RELEASE_TASKS: '1'
    volumes: [media:/app/media]
    mem_limit: 768m
    depends_on:
      web: {condition: service_healthy}
    healthcheck: {disable: true}
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U horilla_user -d horilla_db']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?required}
    volumes: [redis_data:/data]
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, -a, '${REDIS_PASSWORD}', ping]
      interval: 5s
      timeout: 5s
      retries: 10
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - staticfiles:/static:ro
      - ../files/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 128m
    depends_on:
      web: {condition: service_healthy}
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.top100-work-http.rule=Host(`work.top100afl.com`)
      - traefik.http.routers.top100-work-http.entrypoints=web
      - traefik.http.routers.top100-work-http.middlewares=redirect-to-https@file
      - traefik.http.routers.top100-work.rule=Host(`work.top100afl.com`)
      - traefik.http.routers.top100-work.entrypoints=websecure
      - traefik.http.routers.top100-work.tls.certresolver=letsencrypt
      - traefik.http.services.top100-work.loadbalancer.server.port=80
networks:
  dokploy-network:
    external: true
volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
