name: Android App Bundle

on:
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36 components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned release bundle
        working-directory: android
        run: sh ./gradlew --no-daemon --console=plain --max-workers=2 bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: top100-android-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
