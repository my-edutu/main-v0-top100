# Temporary, branch-scoped maintenance job. Generates an unreferenced lockfile
# blob for review; it cannot merge or move any branch. Remove after the repair.
name: Prepare selection dependency repair
on:
  push:
    branches: ['fix/selection-assurance-review-20260907']
    paths: ['.github/workflows/selection-dependency-repair.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'my-edutu/main-v0-top100' && github.ref == 'refs/heads/fix/selection-assurance-review-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve patched Browserslist without changing package requirements
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/selection-lock-before.json"
          npm update browserslist --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json
          node <<'NODE'
          const fs = require('node:fs')
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/selection-lock-before.json', 'utf8'))
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (JSON.stringify(before.packages['']) !== JSON.stringify(after.packages[''])) throw new Error('Root dependency requirements changed')
          let seen = 0
          for (const [path, info] of Object.entries(after.packages)) {
            if (!/(^|\/)node_modules\/browserslist$/.test(path)) continue
            const parts = String(info.version).split('.').map(Number)
            if (parts.length !== 3 || parts.some(n => !Number.isInteger(n)) || parts[0] !== 4 ||
                parts[1] < 28 || (parts[1] === 28 && parts[2] < 7)) throw new Error('Unpatched or unexpected Browserslist resolution')
            seen++
          }
          if (!seen) throw new Error('Browserslist was not resolved')
          const paths = new Set([...Object.keys(before.packages), ...Object.keys(after.packages)])
          for (const path of paths) {
            if (JSON.stringify(before.packages[path]) !== JSON.stringify(after.packages[path])) {
              console.log(JSON.stringify({path, before:before.packages[path], after:after.packages[path]}))
            }
          }
          console.log('BROWSERSLIST_PATCHED_RESOLUTIONS=' + seen)
          NODE
          git diff --stat
      - name: Validate lockfile integrity and unchanged audit gate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > "$RUNNER_TEMP/selection-audit.json"
          audit_exit=$?
          set -e
          test -s "$RUNNER_TEMP/selection-audit.json"
          npx --no-install tsx scripts/check-audit-regressions.ts "$RUNNER_TEMP/selection-audit.json"
          echo "Audit command exit was $audit_exit; the existing regression policy above was enforced."
      - name: Store generated lockfile blob for explicit review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          ;(async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},
              body: JSON.stringify({content:fs.readFileSync('package-lock.json','utf8'),encoding:'utf-8'})
            })
            if (!response.ok) throw new Error(`Could not save lockfile blob: HTTP ${response.status}`)
            const result = await response.json()
            if (!/^[a-f0-9]{40}$/.test(result.sha)) throw new Error('Invalid blob response')
            console.log('REVIEWED_LOCKFILE_BLOB_SHA=' + result.sha)
            console.log('SOURCE_COMMIT=' + process.env.GITHUB_SHA)
          })().catch(error => { console.error(error.message); process.exitCode=1 })
          NODE
