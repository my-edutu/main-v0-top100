name: One-time security lockfile refresh

on:
  push:
    branches:
      - audit/webapp-stabilization-2026-10-13
    paths:
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  update-verified-dev-toolchain:
    if: github.repository == 'my-edutu/main-v0-top100' && github.ref == 'refs/heads/audit/webapp-stabilization-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.top100afl.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-local-dev-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-ci-service-role-key
    steps:
      - name: Checkout exact reviewed stabilization branch without persisted write credentials
        uses: actions/checkout@v4
        with:
          ref: audit/webapp-stabilization-2026-10-13
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve patched Vitest major and dependency graph
        run: npm install --save-dev 'vitest@^5.0.4' --package-lock-only --ignore-scripts --no-fund
      - name: Install exact proposed lockfile
        run: npm ci
      - name: Validate entire unit and integration suite
        run: npm test
      - name: Validate production build and TypeScript
        run: npm run build
      - name: Commit only tested manifest and lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes are necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "chore(deps): upgrade Vitest to patched major after full tests and build"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/audit/webapp-stabilization-2026-10-13
